<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#0e0e12;overflow:hidden}
  #stage{position:relative;width:1920px;height:1080px;background:#0e0e12;
    font-family:'DejaVu Sans','Inter',system-ui,sans-serif;color:#F3F4F6}
</style>
</head>
<body>
<div id="stage">
  <svg id="svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
</div>
<script>
// AVV & Drittlandtransfer — 7-scene explainer animation (BookHost, German).
// Contract: window.seekTo(t) is a pure function of absolute t; window.__ready=true when set up.
// Timing comes from window.CONFIG.bounds (6 cut times) + window.CONFIG.total (injected at capture).
const SVG = document.getElementById('svg');
const NS = 'http://www.w3.org/2000/svg';
const C = { bg:'#0e0e12', fg:'#F3F4F6', mut:'#9CA3AF', moss:'#63D297', papaya:'#FA5D19', violet:'#8B5CF6', amber:'#F59E0B' };
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const seg=(t,t0,t1)=>ease(clamp((t-(t0))/((t1)-(t0)||1e-6),0,1));
function el(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
function text(x,y,s,{size=42,fill=C.fg,anchor='middle',weight=400,opacity=1}={}){
  const t=el('text',{x,y,'text-anchor':anchor,'font-size':size,fill,'font-weight':weight,'fill-opacity':opacity});
  t.textContent=s;return t;}
function clear(){while(SVG.firstChild)SVG.removeChild(SVG.firstChild);}
function box(cx,cy,w,h,r,stroke,p){return el('rect',{x:cx-w/2,y:cy-h/2,width:w,height:h,rx:r,fill:'none',stroke,'stroke-width':3,'stroke-opacity':p});}
function arrow(x1,y1,x2,y2,color,p){
  const g=el('g',{opacity:p});
  g.appendChild(el('line',{x1,y1,x2:x2-18,y2,stroke:color,'stroke-width':4}));
  g.appendChild(el('path',{d:`M ${x2-24} ${y2-10} L ${x2} ${y2} L ${x2-24} ${y2+10}`,fill:'none',stroke:color,'stroke-width':4,'stroke-linecap':'round'}));
  return g;}
function checkmark(cx,cy,p){
  return el('path',{d:`M ${cx-60} ${cy} L ${cx-10} ${cy+52} L ${cx+64} ${cy-48}`,fill:'none',stroke:C.moss,'stroke-width':14,'stroke-linecap':'round','stroke-linejoin':'round','stroke-opacity':p,'stroke-dasharray':220,'stroke-dashoffset':220*(1-p)});
}
function bounds(){
  const cfg=window.CONFIG||{}; if(cfg.bounds&&cfg.bounds.length)return cfg.bounds;
  const total=(cfg.total||60); return Array.from({length:6},(_,i)=>total*(i+1)/7);
}
function chrome(t,idx,title,sub,p0){
  SVG.appendChild(el('rect',{x:0,y:0,width:1920,height:1080,fill:C.bg}));
  SVG.appendChild(text(64,84,'BookHost',{size:42,fill:C.mut,anchor:'start',opacity:.65}));
  SVG.appendChild(text(1856,84,(idx+1)+' / 7',{size:42,fill:C.mut,anchor:'end',opacity:.65}));
  SVG.appendChild(text(960,190,title,{size:76,weight:700,opacity:seg(t,p0,p0+1)}));
  SVG.appendChild(text(960,1015,sub,{size:40,fill:C.mut,opacity:seg(t,p0+.8,p0+1.8)}));
}
window.seekTo=function(t){
  clear();
  const b=bounds(), total=(window.CONFIG&&window.CONFIG.total)||60;
  const cuts=[0,...b,total], fns=[scene1,scene2,scene3,scene4,scene5,scene6,scene7];
  for(let i=0;i<7;i++){ if(i===6||t<cuts[i+1]){ fns[i](t,cuts[i],cuts[i+1]); return; } }
};
// s1: the question itself, answered "nothing to do right now"
function scene1(t,t0,t1){
  chrome(t,0,'Was ist das Thema?','Ein Datenschutzthema — vorweg: im Moment nichts zu tun',t0);
  const p=seg(t,t0+.4,t0+1.4), q=seg(t,t0+1.6,t0+2.6);
  SVG.appendChild(text(960,470,'„AVV · Drittlandtransfer · Chutes“',{size:60,weight:700,opacity:p}));
  SVG.appendChild(text(960,610,'ein Datenschutzthema',{size:48,fill:C.violet,opacity:q}));
  const p2=seg(t,t0+2.4,t0+3.2), cx=960, cy=800, r=120;
  SVG.appendChild(el('circle',{cx,cy,r,fill:'none',stroke:C.moss,'stroke-width':12,'stroke-opacity':p2}));
  SVG.appendChild(checkmark(cx,cy,seg(t,t0+2.8,t0+3.6)));
}
// s2: roles in the processing agreement
function scene2(t,t0,t1){
  chrome(t,1,'Der AVV','Der AVV regelt, wer was mit den Inhalten darf',t0);
  const y=560, w=400, h=200, xs=[430,960,1490];
  const ps=[seg(t,t0+.3,t0+1.1),seg(t,t0+1.0,t0+1.8),seg(t,t0+1.7,t0+2.5)];
  const boxes=[[C.fg,'Kunde','Verantwortlicher'],[C.moss,'BookHost','im Auftrag'],[C.violet,'Unterauftrag','Hetzner · KI-Anbieter']];
  boxes.forEach((b,i)=>{
    SVG.appendChild(box(xs[i],y,w,h,18,b[0],ps[i]));
    SVG.appendChild(text(xs[i],y-18,b[1],{size:52,weight:700,opacity:ps[i]}));
    SVG.appendChild(text(xs[i],y+52,b[2],{size:40,fill:C.mut,opacity:ps[i]}));
  });
  SVG.appendChild(arrow(640,y,760,y,C.fg,seg(t,t0+1.4,t0+1.9)));
  SVG.appendChild(arrow(1170,y,1290,y,C.fg,seg(t,t0+2.1,t0+2.6)));
}
// s3: data leaving the EU needs a legal basis
function scene3(t,t0,t1){
  chrome(t,2,'Drittlandtransfer','Daten aus der EU heraus: das braucht eine Grundlage',t0);
  const p=seg(t,t0+.3,t0+1.3);
  SVG.appendChild(box(500,600,560,430,60,C.violet,p));
  SVG.appendChild(text(500,615,'EU / EWR',{size:56,weight:700,opacity:p}));
  const q=seg(t,t0+1.2,t0+2.0);
  SVG.appendChild(box(1450,600,420,180,18,C.papaya,q));
  SVG.appendChild(text(1450,615,'außerhalb der EU',{size:44,fill:C.papaya,opacity:q}));
  const pp=seg(t,t0+.6,t0+2.6), dx=560+pp*1060, dy=600-Math.sin(pp*Math.PI)*160;
  SVG.appendChild(el('circle',{cx:dx,cy:dy,r:18,fill:C.fg,'fill-opacity':seg(t,t0+.6,t0+.9)}));
  const r=seg(t,t0+2.8,t0+3.8), bx=960, by=860;
  SVG.appendChild(box(bx,by,560,120,16,C.moss,r));
  SVG.appendChild(text(bx,by-8,'Grundlage',{size:44,weight:700,fill:C.moss,opacity:r}));
  SVG.appendChild(text(bx,by+42,'Art. 44 ff.',{size:40,fill:C.mut,opacity:r}));
}
// s4: the previous AI provider sits outside the EU
function scene4(t,t0,t1){
  chrome(t,3,'Warum Chutes Thema war','Der bisherige KI-Anbieter sitzt außerhalb der EU',t0);
  const p=seg(t,t0+.3,t0+1.3);
  SVG.appendChild(box(420,580,420,340,18,C.moss,p));
  SVG.appendChild(text(420,540,'Wiki',{size:56,weight:700,opacity:p}));
  SVG.appendChild(text(420,620,'Dokument-Eingang',{size:40,fill:C.mut,opacity:p}));
  SVG.appendChild(text(420,682,'Wiki-Chat',{size:40,fill:C.mut,opacity:p}));
  const g=seg(t,t0+1.0,t0+2.0), gx=1500, gy=580;
  SVG.appendChild(el('circle',{cx:gx,cy:gy,r:190,fill:'none',stroke:C.papaya,'stroke-width':4,'stroke-opacity':g}));
  for(const off of [-70,0,70]){
    const dy=gy+off, rx=190*Math.cos(Math.asin(clamp(off/190,-1,1)));
    SVG.appendChild(el('ellipse',{cx:gx,cy:dy,rx,ry:26,fill:'none',stroke:C.papaya,'stroke-width':2,'stroke-opacity':g*.6,'stroke-dasharray':'10 8'}));
  }
  SVG.appendChild(text(gx,gy+44,'früher im Plan',{size:44,fill:C.papaya,opacity:g}));
  for(const[delay,y0]of[[1.6,540],[2.3,660]]){
    const qq=seg(t,t0+delay,t0+delay+1.6), px=560+qq*(gx-190-560), py=y0-Math.sin(qq*Math.PI)*70;
    SVG.appendChild(el('rect',{x:px-26,y:py-16,width:52,height:32,rx:8,fill:C.fg,'fill-opacity':seg(t,t0+delay,t0+delay+.4),'transform':`rotate(${-12*Math.sin(qq*Math.PI)} ${px} ${py})`}));
  }
  SVG.appendChild(text(gx,gy-250,'außerhalb der EU',{size:44,fill:C.mut,opacity:seg(t,t0+2.2,t0+3.0)}));
}
// s5: the decision for an EU provider
function scene5(t,t0,t1){
  chrome(t,4,'Die Entscheidung: TensorX','Neuer EU-Anbieter: TensorX aus Dublin (Anbieterangaben)',t0);
  const p=seg(t,t0+.3,t0+1.3);
  SVG.appendChild(box(700,590,760,520,80,C.moss,p));
  SVG.appendChild(text(700,430,'EU / EWR',{size:52,weight:700,fill:C.moss,opacity:p}));
  const pd=seg(t,t0+1.0,t0+1.8);
  SVG.appendChild(el('circle',{cx:560,cy:640,r:16*pd,fill:C.moss}));
  SVG.appendChild(text(600,656,'Dublin',{size:44,anchor:'start',opacity:pd}));
  const ph=seg(t,t0+1.4,t0+2.2);
  SVG.appendChild(el('circle',{cx:920,cy:520,r:16*ph,fill:C.moss}));
  SVG.appendChild(text(960,536,'Helsinki',{size:44,anchor:'start',opacity:ph}));
  const l=seg(t,t0+2.2,t0+3.2), lx=1430, ly=590;
  SVG.appendChild(box(lx,ly,470,280,20,C.violet,l));
  SVG.appendChild(el('path',{d:`M ${lx-22} 552 A 22 22 0 0 1 ${lx+22} 552`,fill:'none',stroke:C.violet,'stroke-width':7,'stroke-opacity':l}));
  SVG.appendChild(el('rect',{x:lx-35,y:552,width:70,height:58,rx:8,fill:'none',stroke:C.violet,'stroke-width':7,'stroke-opacity':l}));
  SVG.appendChild(el('circle',{cx:lx,cy:580,r:7,fill:C.violet,'fill-opacity':l}));
  SVG.appendChild(text(lx,708,'keine Speicherung',{size:46,weight:700,fill:C.violet,opacity:l}));
  SVG.appendChild(text(lx,758,'(Anbieterangabe)',{size:36,fill:C.mut,opacity:l}));
}
// s6: beta is live, the paperwork check is the open step
function scene6(t,t0,t1){
  chrome(t,5,'Stand heute','Beta läuft — Unterlagen-Prüfung für Kundendaten steht aus',t0);
  const p=seg(t,t0+.3,t0+1.1);
  SVG.appendChild(el('rect',{x:330,y:400,width:230,height:84,rx:42,fill:C.moss,'fill-opacity':p*.18,stroke:C.moss,'stroke-width':3,'stroke-opacity':p}));
  SVG.appendChild(text(445,458,'Beta',{size:48,weight:700,fill:C.moss,opacity:p}));
  SVG.appendChild(text(640,458,'technisch verfügbar',{size:48,anchor:'start',opacity:p}));
  const rows=[['Vertrag (DPA)',560],['Unterauftragsverarbeiterliste',680],['Verarbeitungsorte',800]];
  rows.forEach((row,i)=>{
    const q=seg(t,t0+1.0+i*.6,t0+1.8+i*.6);
    SVG.appendChild(el('circle',{cx:430,cy:row[1],r:26,fill:'none',stroke:C.amber,'stroke-width':5,'stroke-opacity':q,'stroke-dasharray':'164 164','stroke-dashoffset':164*(1-q)}));
    SVG.appendChild(text(490,row[1]+16,row[0],{size:48,anchor:'start',opacity:q}));
  });
}
// s7: Florian's task right now + disclaimer
function scene7(t,t0,t1){
  chrome(t,6,'Deine Aufgabe','Im Moment nichts zu tun — wir prüfen die Unterlagen',t0);
  const p=seg(t,t0+.3,t0+1.3), cx=560, cy=560, r=120;
  SVG.appendChild(el('circle',{cx,cy,r,fill:'none',stroke:C.moss,'stroke-width':12,'stroke-opacity':p}));
  SVG.appendChild(checkmark(cx,cy,seg(t,t0+.8,t0+1.6)));
  SVG.appendChild(text(760,540,'im Moment nichts zu tun',{size:56,weight:700,anchor:'start',opacity:seg(t,t0+1.2,t0+2.0)}));
  SVG.appendChild(text(760,624,'Wir prüfen zuerst.',{size:44,fill:C.mut,anchor:'start',opacity:seg(t,t0+1.8,t0+2.6)}));
  const d=seg(t,t0+2.4,t0+3.4);
  SVG.appendChild(box(960,850,940,150,22,C.amber,d));
  SVG.appendChild(text(960,868,'Erklärung, keine Rechtsberatung',{size:52,weight:700,fill:C.amber,opacity:d}));
}
window.__ready=true;
</script>
</body>
</html>
